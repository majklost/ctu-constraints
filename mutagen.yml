sync:
  constraints:
    alpha: "."
    beta: "mrkosmic@rci:/mnt/personal/mrkosmic/synced/constraints"
    mode: "one-way-safe"
    ignore:
      vcs: true
      paths:
        - "mutagen.yml.lock"
        - "uv.lock"
        # Caches
        - "data/"
        - "datasources/"
        - ".mypy_cache/"
        - "__pycache__/"
        - "wandb/"
        - "weights/"
        - "predictions/"
        - "synced/"
        # Dataset / large binary files
        - "*.npz"
        - "*.zip"
        - "*.pt"
        - "*.pth"
        - "*.ckpt"
        - "*.pyc"
        - "*.tfrecord"
        - "*.LICENSE"
        # Build artifacts
        - "dist/"
        - "*.egg-info/"
        # Quarto build metadata (never sync between machines — always regenerable)
        - ".quarto/"
        - "_freeze/"
        - "_output/"
        - "output/"
        - "*_files/"
        - "*_cache/"
        - "*.quarto_ipynb"
        - "*.quarto_ipynb_*"
        - "*.typ"

        # OS/IDE
        - ".DS_Store"
        - ".vscode/"
        - ".venv/"

  syncedcontent:
    alpha: "synced/"
    beta: "mrkosmic@rci:/mnt/personal/mrkosmic/synced/constraints/synced"
    mode: "two-way-resolved"
