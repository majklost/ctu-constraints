[project]
name = "ctu-constraints"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Michal Mrkos", email = "mrkosmic@fel.cvut.cz" }
]
dependencies = [
    "torch==2.8.0",
    "ipywidgets>=8.1.8",
    "monai>=1.5.2",
    "seaborn>=0.13.2",
    "segmentation-models-pytorch>=0.5.0",
    "wandb>=0.25.1",
    'neurite @ git+https://github.com/adalca/neurite.git@dev',
    "matplotlib>=3.10.3",
    "tensorboard>=2.20.0",
    "setuptools<82", # FIX: Restores pkg_resources required by TensorBoard 2.20+
    "kornia>=0.8.3",
    "torch-tb-profiler>=0.4.3",
    "jupyter-cache>=1.0.1",
    "polars>=1.43.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["constraints"]

[tool.hatch.metadata]
allow-direct-references = true


[dependency-groups]
dev = [
    "ipykernel==7.1.0",
    "jupyter>=1.1.1",
    "jupytext>=1.19.5",
    "nbformat>=5.10.4",
    "pytest>=9.0.3",
    "ruff>=0.15.4",
]

# installation uv add --group <name> <package>
# uv sync --group <name>
local = [
    "torchvision==0.23.0",
    "pytorch-lightning==2.5.5",
    "torchmetrics==1.8.2",
    "timm==1.0.22",
    "albumentationsx==2.0.12",
    "opencv-python-headless==4.12.0.88",
    "scikit-learn==1.7.2",
    "pandas==2.3.0",
    "matplotlib==3.10.3",
    "einops==0.8.1",
]
# add this to group "pytorch3d==0.7.9",
# [tool.uv.sources]
# pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git", tag = "v0.7.9" }

# CRITICAL FIX: Injects torch into the temporary build container 
# [tool.uv.extra-build-dependencies]
#pytorch3d = ["torch==2.8.0", "setuptools"]

[tool.ruff]
extend-include = ["*.ipynb"]
line-length = 88
select = ["E", "F", "I", "N", "UP", "B"] # Enforces good style, imports, and modern Python features
ignore = ["F401"] # Ignore unused imports so they aren't removed on save

[tool.pytest.ini_options]# Tells pytest that the root directory contains your package ('carotide')
pythonpath = ["."]

# Tells pytest where your test files live
testpaths = ["tests"]

# Default flags: verbose summary for all except passed tests, strict markers
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m not slow"
]

# Registers your custom markers so pytest doesn't throw warnings
markers = [
    "smoke: Quick local execution tests running under 5 seconds",
    "slow: Heavy cluster training/validation steps",
]
